
name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run extraction and load (small sample)
        working-directory: extract
        run: uv run python -c "from extract import extract_all_bills, load_to_duckdb; load_to_duckdb(extract_all_bills(limit_per_type=5))"

      - name: dbt build and test
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --full-refresh