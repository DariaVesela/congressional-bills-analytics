
name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run extraction and load
        working-directory: extract
        run: uv run extract.py

      - name: Run dbt build
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build --full-refresh